interface:
  display_name: "テキスト文書アーキテクト"
  short_description: "読者の用途と書き手の立場に合わせ、構成・内容・語調を整える文書を設計"
  default_prompt: "$document-authoring:text-document-architect を使って、この素材から、読者の利用目的と書き手の立場を踏まえ、構成と語調が適切な文書を設計・作成してください。"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
policy:
  allow_implicit_invocation: true
